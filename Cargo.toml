[package]
name = "kanpachi-engine"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Kanpachi's network engine: EasyTier as a library, with no administration portal"
repository = "https://github.com/alvarogabrielgomez/kanpachi-engine"

# The dependency is a FORK of EasyTier, following its `kanpachi` branch, with
# Cargo.lock as the only authority on which commit gets built.
#
# The fork exists for one reason, and it is measured. Upstream writes permanent
# Windows Firewall ALLOW rules from inside `NetworkInstance::start()`: one that
# opens the virtual adapter to all traffic, and one that grants this executable
# inbound "any protocol" on EVERY interface of the machine, home network
# included. Neither can be turned off through a feature, a config field or an
# environment variable, and both outlive the process that caused them.
#
# Kanpachi opens only what the active game profile asks for, only toward the
# members present in the room. An allow-all on the same interface undoes that
# in the same layer used to grant access, so the calls are removed instead.
#
# The fork is upstream `v2.6.4` plus those two deletions, plus
# `renew_credential` (pushes a credential's expiry forward without reissuing
# it), plus four backports of upstream fixes that exist in no release
# (#2301, #2315, #2393, #2476), plus one change of its own: the owner election
# for a non-reusable credential prefers the freshest incarnation, so a peer
# that reconnects no longer loses to its own ghost. Each hunk is listed in the
# fork's own FORK.md, and the claim is meant to be checked rather than
# believed:
#
#     git diff v2.6.4 kanpachi -- '*.rs' '*.proto'
#
# A branch on the fork, and the asymmetry against upstream is the point. Pointing
# at upstream `main` would break the build on somebody else's commit at a moment
# nobody chose: the `launcher` and `instance_manager` modules are already gone
# there, because the whole RPC tree was deleted and reborn elsewhere. The
# `kanpachi` branch is ours and nobody else moves it, so that objection does not
# carry over, and `Cargo.lock` is what records which commit this actually builds.
#
# It is a branch rather than a versioned tag because the engine is not versioned
# yet. Kanpachi is at v0, and a tag per patch set buys a number nobody reads at
# the price of force-pushing it every time the fork moves.
# Features chosen on purpose, and the choosing is a security measure rather
# than a size one.
#
# Turning a capability off with a flag leaves the code in the binary and trusts
# the flag. Leaving the feature out DELETES the capability, which nothing can
# re-enable at runtime.
#
# Dropped from the default set:
#
#   magic-dns  the one that matters most. It edits the machine's DNS and opens
#              a loopback socket, and that socket is exactly what an earlier
#              measurement of "does this thing listen" missed.
#   socks5     a proxy into the virtual network. Surface with no purpose here.
#   wireguard  boringtun, which exists to serve --vpn-portal. Kanpachi never
#              runs a WireGuard server. It is NOT the tunnel encryption: that
#              is `encryption_algorithm`, and it stays.
#   faketcp    a transport nothing in the product asks for.
#
# Kept: tun, because there has to be an adapter; websocket, kcp and quic, which
# are how peers reach each other through awkward networks; smoltcp, used by the
# proxy path; zstd for compression; aes-gcm for the tunnel encryption.
#
# `windivert` is NOT in this list and cannot be: on Windows x86 and x86_64 it is
# an unconditional dependency, so no combination of features removes the
# packet-capture driver from the binary. That is why the product's containment
# rests on the firewall and not on the engine being incapable.
# By TAG and not by branch, since 2026-08-19. The real pin was always
# Cargo.lock, which records the exact commit; what the tag adds is durability
# and a name: a branch can be force-pushed or deleted and the locked commit
# with it, while a tag names the commit forever and `--locked` (now on every
# build) refuses silent drift. Moving to a new fork commit is: tag it there,
# change this line, regenerate the lock, one commit.
[dependencies]
easytier = { git = "https://github.com/alvarogabrielgomez/EasyTier", tag = "v2.6.4-kanpachi.1", default-features = false, features = [
    "tun",
    "websocket",
    "smoltcp",
    "kcp",
    "quic",
    "zstd",
    "aes-gcm",
] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# El subscriber de `tracing` se arma acá y no se toma el de EasyTier, porque el
# suyo no tiene por dónde meter una capa y hace falta envolver el ESCRITOR para
# que el secreto de la red y la llave privada no terminen en un fichero que se
# manda por chat. Ver `src/log.rs`.
#
# Las versiones son las MISMAS que declara EasyTier, `0.1` y `0.3`, y tienen que
# seguir siéndolo: si cargo resolviera dos incompatibles, el `Registry` de acá
# sería otro tipo que el de sus capas. Eso no compila, que es la forma buena de
# fallar.
tracing = "0.1"
tracing-subscriber = "0.3"

# Only what the command loop needs. `net` is deliberately absent: this engine
# opens no socket of its own, and a dependency that cannot listen is a stronger
# statement than a rule saying it must not.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
