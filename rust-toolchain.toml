# Pinned to the toolchain EasyTier itself builds with at tag v2.6.4.
#
# It is not "the newest one that works": the dependency is a large tree with
# native build scripts, and the compiler upstream tests against is the one with
# the fewest unknowns. Raising it is a deliberate change, not a side effect of
# whatever is installed on the machine.
[toolchain]
channel = "1.95"
# Without this line rustup installs the pinned channel BARE, and the CI's
# clippy step dies with "cargo-clippy.exe is not installed" — which is exactly
# what happened: three consecutive engine commits shipped inside a Kanpachi
# installer with every gate red, because the gate could not even start. The
# fix lives here and not as a `rustup component add` in the workflow, because
# this file is, by the decision written above, the only place the toolchain is
# changed.
components = ["clippy", "rustfmt"]
# Los dos objetivos, y cada artefacto se compila EN su sistema.
#
# Que estén los dos acá no habilita el cross-compile y no pretende habilitarlo:
# en Linux, EasyTier arrastra `dbus` vendored, `zstd-sys` y `kcp-sys` con
# bindgen, o sea tres cadenas de C que necesitarían enlazador y sysroot de Linux
# montados a mano en Windows. Lo que esta lista hace es que un `rustup` en
# cualquiera de las dos máquinas instale lo que ahí hace falta sin que nadie
# tenga que acordarse del nombre del objetivo.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
