name: build

# Two triggers, two meanings. A push or PR is the CUSTOMS CHECK: does this code
# get to travel. A `v*` tag is a RELEASE: the same checks, on both platforms,
# and then the binaries that PASSED them are published — so the artefact
# Kanpachi downloads is the artefact that was checked, not a second compilation
# of hopefully the same commit. Kanpachi pins the tag in its `engine.pin` and
# verifies the SHA256SUMS this workflow writes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # On a tag, the tag and Cargo.toml must agree BEFORE anything is spent
      # compiling: a v0.2.0 whose Cargo.toml says 0.1.0 would stamp every
      # binary with a version that contradicts its own file name.
      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $toml = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $toml) { throw "tag v$tag but Cargo.toml says $toml. Bump Cargo.toml (and regenerate Cargo.lock) in the tagged commit." }
          Write-Host "tag v$tag == Cargo.toml $toml"

      # Sets up cl.exe and link.exe. Without it the native build scripts in the
      # dependency tree (zstd-sys, kcp-sys, windivert) have no compiler.
      - uses: ilammy/msvc-dev-cmd@v1

      # The toolchain comes from rust-toolchain.toml, pinned on purpose. It is
      # not read here so that raising it stays a single-file change.
      - name: rust
        run: |
          rustup show
          rustc --version
          cargo --version

      # easytier's build.rs downloads protoc when it cannot find one. Installing
      # it explicitly turns a network fetch inside a build script into a step
      # that fails visibly when it fails.
      - name: protoc
        run: choco install protoc --no-progress -y

      # bindgen, used by kcp-sys. The runner image ships LLVM; the path is
      # stated rather than assumed to be on PATH.
      - name: libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # --locked: Cargo.lock IS the pin of the easytier fork. Without the flag
      # a stale lock regenerates silently and the binary comes out of a commit
      # nobody wrote down anywhere.
      #
      # KANPACHI_ENGINE_BUILD_REF seals the resolved commit into the binary as
      # its build id; see build.rs. The banner, the VERSIONINFO and the
      # in-file sentinel all carry it, which is what lets anybody holding the
      # file answer "which engine is this".
      - name: build
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo build --locked --release

      - name: clippy
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --check

      - name: test
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo test --locked --release

      # The invariant that justifies this binary existing at all: it must not
      # listen anywhere. Enforced two ways, because they fail differently.
      #
      #   1. No source in this repository may construct a listener. Catches the
      #      code before it can run.
      #   2. The socket test in `tests/` starts the engine for real, with the
      #      TUN device up, and fails on any LISTENING socket owned by the
      #      process. Catches what a dependency opens on our behalf, which is
      #      how the magic-DNS port was missed the first time it was measured.
      #
      # Step 2 arrives with the engine itself; `cargo test` above runs it.
      - name: no listener in source
        shell: pwsh
        run: |
          $hits = Select-String -Path src\*.rs -Pattern 'TcpListener|UdpSocket::bind|NamedPipe|CreateNamedPipe|bind\(' -AllMatches
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line }
            throw "the engine has exactly one command input, stdin. A second channel rebuilds the unauthenticated portal under another name."
          }
          Write-Host "no listener constructed in src/"

      - name: keep the binary for publishing
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: target/release/kanpachi-engine.exe
          if-no-files-found: error

  # The Linux half of the same customs check. It did not exist until
  # 2026-08-19, which meant the engine inside every published .deb had never
  # been checked by anything: no clippy, no tests, no socket test.
  #
  # ubuntu-22.04 and not -latest, and it is a shipping decision, not a
  # preference: the binary's glibc floor decides which Ubuntu the package runs
  # on. Built on 24.04 it demands glibc 2.39 and does not start on 22.04,
  # which is what a VPS most often runs. Same reasoning written in
  # scripts/build-linux.sh.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toml=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$toml" ]; then
            echo "tag v$tag but Cargo.toml says $toml. Bump Cargo.toml (and regenerate Cargo.lock) in the tagged commit." >&2
            exit 1
          fi
          echo "tag v$tag == Cargo.toml $toml"

      # `protobuf-compiler` for easytier's build.rs, `libclang-dev` for
      # kcp-sys's bindgen, `build-essential` for zstd-sys and for the dbus
      # that EasyTier declares as a NON-optional Linux dependency with
      # features = ["vendored"], so it compiles libdbus from source whether or
      # not magic-dns is on.
      - name: what the Rust chain needs
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev build-essential pkg-config

      - name: rust
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: build
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo build --locked --release

      - name: clippy
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        env:
          KANPACHI_ENGINE_BUILD_REF: ${{ github.sha }}
        run: cargo test --locked --release

      - name: no listener in source
        run: |
          if grep -nE 'TcpListener|UdpSocket::bind|NamedPipe|CreateNamedPipe|bind\(' src/*.rs; then
            echo "the engine has exactly one command input, stdin. A second channel rebuilds the unauthenticated portal under another name." >&2
            exit 1
          fi
          echo "no listener constructed in src/"

      - name: keep the binary for publishing
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux
          path: target/release/kanpachi-engine
          if-no-files-found: error

  # Publishes ONLY what passed both jobs above, which is the point of the whole
  # workflow: the binary Kanpachi ships is the binary that went through
  # customs, not a re-compilation of the same commit somewhere else.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: sums
        run: |
          cd out
          mv engine-windows/kanpachi-engine.exe .
          mv engine-linux/kanpachi-engine .
          sha256sum kanpachi-engine.exe kanpachi-engine > SHA256SUMS-engine
          cat SHA256SUMS-engine

      # The release body quotes the changelog section verbatim, which is why
      # the changelog is written in English. An empty section fails the
      # publish on purpose: a release with nothing to say about itself is a
      # release whose changelog was forgotten.
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## /           { grab=0 }
            grab                     { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version. Cut it in the tagged commit." >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Built from \`${GITHUB_SHA}\`. Consumed by Kanpachi's release through its"
            echo "\`engine.pin\`; not meant to be downloaded by hand. Each binary carries its"
            echo "build id in a \`KANPACHI-ENGINE-BUILD-ID{...}\` sentinel readable off the file."
          } >> notes.md

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            out/kanpachi-engine.exe
            out/kanpachi-engine
            out/SHA256SUMS-engine
